<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fffaf2">
  <title>今日家宴 · 预点菜</title>
  <style>
    :root{--ink:#173f3b;--green:#267264;--soft:#eaf2eb;--paper:#fffcf7;--cream:#f6f2e9;--line:#e6e7de;--muted:#748078;--orange:#cf6547}
    *{box-sizing:border-box}
    [hidden]{display:none!important}
    body{margin:0;background:#e8ebe4;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px}
    button,input,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation;color:inherit;border:0;background:none;min-height:44px}button:disabled{opacity:.5;cursor:default}button:focus-visible,a:focus-visible{outline:3px solid #d8994e;outline-offset:2px}input,textarea{font-size:16px;color:var(--ink)}
    .app{height:100vh;height:100dvh;max-width:680px;margin:auto;display:flex;flex-direction:column;background:var(--paper);overflow:hidden}
    .header{padding:calc(12px + env(safe-area-inset-top)) 16px 12px;flex-shrink:0;border-bottom:1px solid var(--line)}
    .brand-row{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand-row h1{font-size:23px;margin:0;letter-spacing:1px}.custom-link{font-size:13px;color:var(--green);padding:0 0 0 8px}
    .meal-link{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:0;margin:0 0 7px;font-size:14px}.meal-link strong{font-weight:600}.meal-link span{margin-left:auto;color:var(--muted);font-size:12px}
    .search-box{display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:12px;background:#eeeee6;height:44px}.search-box input{min-width:0;width:100%;border:0;outline:none;background:none}.search-box:focus-within{box-shadow:0 0 0 2px #26726455}.search-box button{padding:0 3px;font-size:20px}
    .workspace{display:flex;flex:1;min-height:0}.categories{width:79px;flex-shrink:0;background:var(--cream);overflow-y:auto;overscroll-behavior:contain;padding:8px 0 20px;scrollbar-width:none}.category{position:relative;display:block;width:100%;padding:16px 5px;font-size:13px;text-align:center;border-left:3px solid transparent;min-height:54px}.category.active{background:var(--paper);border-left-color:var(--green);font-weight:700;color:var(--green)}.category small{display:inline-flex;align-items:center;justify-content:center;background:var(--orange);color:white;min-width:16px;height:16px;border-radius:8px;font-size:10px;margin-left:2px}
    .content{flex:1;min-width:0;display:flex;flex-direction:column}.content-head{padding:15px 12px 0;flex-shrink:0}.content-heading{display:flex;justify-content:space-between;align-items:baseline;gap:5px;margin-bottom:9px}.content-heading h2{font-size:18px;margin:0}.content-heading span{font-size:12px;color:var(--muted)}.groups{display:flex;gap:7px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}.group{white-space:nowrap;min-height:36px;padding:7px 12px;background:var(--cream);border-radius:9px;font-size:13px}.group.active{background:var(--ink);color:white}
    .dish-list{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 12px 24px;scrollbar-width:thin}.dish{display:flex;gap:11px;padding:15px 0;border-bottom:1px solid var(--line)}.photo{width:78px;height:78px;padding:0;flex-shrink:0;position:relative;overflow:hidden;border-radius:12px;background:#eae7de}.photo img{height:100%;width:100%;object-fit:cover;display:block}.photo span{position:absolute;bottom:0;left:0;padding:2px 5px;background:#173f3bbd;color:#fff;font-size:9px;border-radius:0 5px 0 0}.dish-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:6px}.dish-name{font-size:15px;line-height:1.5;margin:0;font-weight:600;overflow-wrap:anywhere}.dish-actions{display:flex;align-items:center;justify-content:space-between;gap:2px}.picked{font-size:11px;color:var(--green)}.stepper{display:flex;align-items:center;gap:0;flex-shrink:0}.stepper button{min-width:44px;min-height:44px;padding:0;font-size:22px}.stepper .plus{color:var(--green)}.stepper output{min-width:17px;text-align:center;font-size:14px;font-weight:600}.add-button{background:var(--soft);color:var(--green);border-radius:10px;padding:0 13px;min-height:40px;font-size:13px}.dish.selected .photo{box-shadow:0 0 0 2px #267264}
    .bottom{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--paper);flex-shrink:0}.summary{flex:1;text-align:left;padding:0;min-width:0}.summary strong{display:block;font-size:16px}.summary span{display:block;color:var(--muted);font-size:12px;margin-top:4px}.primary{border-radius:12px;background:var(--green);color:white;padding:12px 18px;font-weight:600}.primary.warm{background:var(--orange)}.wide{width:100%;margin-top:14px}.secondary{border:1px solid #d8e1d6;border-radius:12px;padding:10px 14px;background:var(--paper)}
    dialog{border:0;padding:0;background:var(--paper);color:var(--ink);width:min(100%,560px);max-width:100%;max-height:90vh;max-height:90dvh;position:fixed;margin:auto auto 0;inset:auto 0 0;border-radius:23px 23px 0 0;box-shadow:0 -10px 60px #143f3b12;overscroll-behavior:contain}dialog::backdrop{background:#183b355e}.sheet-body{padding:8px 20px calc(22px + env(safe-area-inset-bottom))}.handle{width:36px;height:4px;border-radius:4px;background:#dbded4;margin:2px auto 8px}.sheet-header{display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:0;background:var(--paper);z-index:1;padding:6px 0}.sheet-header h2{font-size:20px;margin:0}.close{font-size:13px;color:var(--green);padding:0 0 0 10px}.sheet-sub{color:var(--muted);font-size:13px;line-height:1.6;margin:4px 0 14px}label{display:block;font-size:13px;margin:14px 0 7px}.field{width:100%;min-width:0;max-width:100%;border:1px solid #dce1d5;border-radius:10px;background:white;padding:12px;min-height:46px}textarea.field{resize:vertical;min-height:74px}.meal-options{display:flex;gap:8px}.meal-options button{flex:1;border-radius:10px;border:1px solid var(--line);padding:10px}.meal-options button.active{background:var(--ink);color:white;border-color:var(--ink)}
    .order-meal{display:flex;align-items:center;justify-content:space-between;width:100%;border-radius:12px;background:var(--soft);padding:12px;text-align:left;font-weight:600}.order-meal small{font-weight:400}.order-row{padding:14px 0;border-bottom:1px solid var(--line)}.order-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.order-top strong{font-size:15px;overflow-wrap:anywhere}.order-tools{display:flex;align-items:center;justify-content:space-between;gap:8px}.delete{font-size:12px;color:#a25743;padding:0}.item-note{font-size:14px;min-height:40px;padding:9px 11px}.order-row label{font-size:12px;color:var(--muted);margin:4px 0 6px}.order-footer{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:10px}.text-link{font-size:13px;color:var(--green);padding:0}.empty{padding:35px 6px;text-align:center;color:var(--muted);font-size:14px;line-height:1.8}.receipt{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;font-size:15px;line-height:1.9;background:#eef2e9;padding:16px;border-radius:12px}.receipt-actions{display:flex;gap:10px;margin-top:10px}.receipt-actions button{flex:1;font-size:14px}.preview-image{width:100%;max-height:50vh;object-fit:contain;border-radius:12px;background:var(--cream)}.source{font-size:12px;color:var(--green);overflow-wrap:anywhere}.toast{position:fixed;bottom:calc(100px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);max-width:90vw;width:max-content;background:#173f3b;color:#fff;border-radius:12px;padding:11px 16px;font-size:14px;box-shadow:0 5px 25px #0002;z-index:20;pointer-events:none}.error{font-size:13px;color:#a33c2f;margin-top:10px}
    @media(min-width:560px){.categories{width:100px}.category{font-size:15px}.photo{width:96px;height:96px}.dish-name{font-size:17px}.dish{padding:18px 0}.content-head{padding:18px 20px 0}.dish-list{padding-left:20px;padding-right:20px}}
    @media(max-width:350px){.categories{width:66px}.category{font-size:12px}.photo{width:64px;height:72px}.dish{gap:8px}.dish-name{font-size:14px}.content-head{padding-left:9px;padding-right:9px}.dish-list{padding-left:9px;padding-right:9px}.picked{font-size:10px}.header{padding-left:12px;padding-right:12px}.bottom{padding-left:12px;padding-right:12px}}

    .greeting{margin:0 0 2px;font-size:12px;line-height:1.6;color:#91745c;min-height:20px}
    .brand-row h1{letter-spacing:2px}.header{background:linear-gradient(120deg,#fffaf2,#fffcf7)}
    button{transition:background-color .18s ease,transform .18s ease,box-shadow .18s ease}
    button:active{transform:scale(.97)}.photo img{transition:transform .25s ease}.photo:active img{transform:scale(1.05)}
    .dish{border-radius:13px;transition:background-color .2s ease}.dish.selected{background:#eaf2eb99}.dish.selected .photo{box-shadow:0 0 0 2px #85aa93}.dish.selected .picked{font-weight:600}
    .category small{position:absolute;right:5px;top:5px;margin:0;border:2px solid var(--cream);min-width:19px;height:19px;font-weight:500}.category.active small{border-color:var(--paper)}
    .primary{box-shadow:0 3px 8px #26726418}.primary.warm{box-shadow:0 3px 8px #cf654720}
    dialog[open]{animation:sheet-enter .22s ease-out}.stepper output.bump{animation:quantity-bump .28s ease-out}
    @keyframes sheet-enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes quantity-bump{50%{transform:scale(1.3);color:var(--orange)}}
    .receipt-welcome{text-align:center;padding:5px 0 14px;position:relative;overflow:hidden}.receipt-welcome .heart-seal{font-size:27px;color:#c46959;display:inline-flex;align-items:center;justify-content:center;width:54px;height:54px;border-radius:50%;background:#f8e9de}.receipt-welcome p{font-size:14px;color:#83695b;margin:10px 0 0;line-height:1.6}
    .heart-burst{pointer-events:none;position:absolute;inset:0}.heart-burst span{position:absolute;left:50%;top:35px;color:#cb705c;font-size:16px;opacity:0;animation:heart-float 1.4s ease-out both;animation-delay:var(--delay)}
    @keyframes heart-float{0%{opacity:0;transform:translate(-50%,0) scale(.4)}20%{opacity:.8}100%{opacity:0;transform:translate(calc(-50% + var(--x)),var(--y)) rotate(var(--r)) scale(1)}}
    .receipt{background:#f2f3e9;border:1px solid #e6e8dc}.wish-label{display:flex;justify-content:space-between;gap:8px}.wish-label span{font-size:12px;color:var(--muted)}.card-button{border-color:#dfbb9f;background:#fff6e9;color:#77543b}.card-help{text-align:center}.share-images{display:grid;gap:18px}.share-page{margin:0}.share-page img{width:100%;height:auto;display:block;border-radius:14px;box-shadow:0 5px 20px #684b2c15}.share-page figcaption{font-size:12px;color:var(--muted);text-align:center;margin:8px 0}.share-page a{display:block;text-align:center;text-decoration:none;color:var(--green);font-size:14px;padding:12px;border:1px solid #d8e1d6;border-radius:10px;margin-top:8px}.share-status{font-size:13px;color:var(--muted);line-height:1.6}
    @media(prefers-reduced-motion:reduce){button,.photo img,.dish{transition:none}dialog[open],.stepper output.bump,.heart-burst span{animation:none}}
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="brand-row"><h1>今日家宴</h1><button class="custom-link" id="openCustom">＋ 自定义菜</button></div>
      <p class="greeting" id="greeting"></p>
      <button class="meal-link" id="openMeal"><strong id="mealLabel"></strong><span>更换日期 / 餐次 ›</span></button>
      <div class="search-box"><span aria-hidden="true">⌕</span><input id="search" type="search" aria-label="搜索菜名、食材或做法" placeholder="搜菜名、食材或做法" autocomplete="off"><button id="clearSearch" aria-label="清除搜索" hidden>×</button></div>
    </header>
    <div class="workspace"><nav class="categories" id="categories" aria-label="菜品分类"></nav><section class="content" aria-label="点菜区"><div class="content-head" id="contentHead"></div><div class="dish-list" id="dishList"></div></section></div>
    <footer class="bottom"><button class="summary" id="openOrder"><strong id="orderCount">还没有选菜</strong><span id="orderHint">挑几道家人想吃的菜</span></button><button class="primary warm" id="reviewOrder">查看清单</button></footer>
  </main>
  <dialog id="mealDialog" aria-labelledby="mealTitle"><form class="sheet-body" id="mealForm"><div class="handle"></div><header class="sheet-header"><h2 id="mealTitle">安排哪一餐？</h2><button type="button" class="close" data-close>取消</button></header><p class="sheet-sub">每一餐单独保存菜品和备注，切换后可继续编辑。</p><label for="date">预定日期</label><input id="date" class="field" type="date" required><label>用餐时段</label><div class="meal-options" id="mealOptions"></div><div class="error" id="mealError" role="alert" hidden></div><button class="primary wide" type="submit">开始点这一餐</button></form></dialog>
  <dialog id="orderDialog" aria-labelledby="orderTitle"><section class="sheet-body"><div class="handle"></div><header class="sheet-header"><h2 id="orderTitle">这一餐的清单</h2><button class="close" data-close>继续点菜</button></header><button class="order-meal" id="changeOrderMeal"></button><div id="orderList"></div><label for="note">整餐备注</label><textarea class="field" id="note" maxlength="500" placeholder="例如少辣、不要香菜、预计6点开饭"></textarea><div class="order-footer"><span id="orderTotal"></span><button class="text-link" id="lastReceipt">上次预订单</button></div><div class="error" id="orderError" role="alert" hidden></div><button class="primary warm wide" id="generate">生成预订单</button></section></dialog>
  <dialog id="customDialog" aria-labelledby="customTitle"><form class="sheet-body" id="customForm"><div class="handle"></div><header class="sheet-header"><h2 id="customTitle">加一道想吃的菜</h2><button type="button" class="close" data-close>取消</button></header><label for="customName">菜名</label><input id="customName" class="field" maxlength="60" placeholder="输入菜单外的菜名" required><label for="customNote">这道菜的备注</label><input id="customNote" class="field" maxlength="200" placeholder="例如清蒸、少放盐"><button class="primary wide" type="submit">加入这一餐</button></form></dialog>
  <dialog id="receiptDialog" aria-labelledby="receiptTitle"><section class="sheet-body"><div class="handle"></div><header class="sheet-header"><h2 id="receiptTitle">预订单已生成</h2><button class="close" data-close>关闭</button></header><div class="receipt-welcome"><div class="heart-seal" aria-hidden="true">♡</div><p>想吃的都记好了，期待一起好好吃饭。</p><div class="heart-burst" id="heartBurst" aria-hidden="true"></div></div><pre class="receipt" id="receiptText" tabindex="0"></pre><label class="wish-label" for="wish">写句悄悄话<span>选填 · 最多120字</span></label><textarea class="field" id="wish" maxlength="120" placeholder="例如今天辛苦啦，多点一个你喜欢的菜"></textarea><button class="primary wide" id="copyReceipt">复制清单，发给家人</button><button class="secondary card-button wide" id="makeCard">♡ 制作这一餐分享卡</button><p class="sheet-sub" id="copyStatus" role="status"></p><div class="receipt-actions"><button class="secondary" id="editMeal">继续修改本餐</button><button class="secondary" id="nextMeal">安排下一餐</button></div></section></dialog>
  <dialog id="previewDialog" aria-labelledby="previewTitle"><section class="sheet-body"><div class="handle"></div><header class="sheet-header"><h2 id="previewTitle"></h2><button class="close" data-close>关闭</button></header><img id="previewImage" class="preview-image" alt=""><p id="previewNote" class="sheet-sub"></p><a class="source" id="previewSource" target="_blank" rel="noopener"></a></section></dialog>
  <dialog id="shareDialog" aria-labelledby="shareTitle"><section class="sheet-body"><div class="handle"></div><header class="sheet-header"><h2 id="shareTitle">这一餐，送给你</h2><button class="close" id="backReceipt">返回清单</button></header><p class="sheet-sub card-help">长按图片可尝试存储到相册，也可使用下方保存按钮。</p><div class="share-images" id="shareImages"></div><button class="primary wide" id="shareCard" hidden>分享图片</button><p class="share-status" id="shareStatus" role="status"></p></section></dialog>
  <div class="toast" id="toast" role="status" hidden></div>
  <script src="handoff.js?v=de5978c2564d"></script>
</body>
</html>
