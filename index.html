<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#153f42"><title>今日家宴 · 预点菜</title><style>
:root{--ink:#163e40;--teal:#237871;--cream:#fff9ef;--paper:#fffdfa;--coral:#e87159;--line:#ece5db;--muted:#788280}*{box-sizing:border-box}body{margin:0;background:var(--cream);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#18383a;padding-bottom:90px}.app{max-width:560px;margin:auto}.hero{margin:14px 16px 0;height:178px;padding:20px;border-radius:25px;color:white;background:linear-gradient(112deg,#123f42e8,#1d69627a),url('seafood-feast.png') center/cover}.eyebrow{font-size:11px;letter-spacing:1.6px;opacity:.85}.hero h1{font-size:29px;margin:40px 0 6px}.hero p{margin:0;font-size:14px;opacity:.92}.search{display:flex;align-items:center;margin:15px 16px 10px;padding:0 14px;height:47px;border:1px solid var(--line);border-radius:15px;background:white;box-shadow:0 5px 16px #244a4510}.search input{border:0;outline:0;background:transparent;min-width:0;flex:1;font:inherit;margin-left:8px}.steps{display:flex;gap:6px;margin:12px 16px 18px}.step{flex:1;padding:9px 7px;border-radius:12px;background:#f0eee8;color:#78817e;font-size:12px;text-align:center}.step.active{color:white;background:var(--ink)}.heading{display:flex;justify-content:space-between;align-items:end;margin:18px 16px 11px}.heading h2{margin:0;font-size:19px}.heading span{font-size:12px;color:var(--muted)}.quick{display:flex;overflow:auto;gap:9px;padding:0 16px 4px;scrollbar-width:none}.quick button{flex:none;background:#e9f2ef;border:0;border-radius:99px;padding:9px 13px;font:inherit;font-size:13px;color:#28665f}.categories{display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:0 16px}.category{position:relative;overflow:hidden;min-height:116px;border:1px solid var(--line);border-radius:18px;padding:16px;background:var(--paper);text-align:left;color:var(--ink)}.category b{display:block;font-size:20px;margin-bottom:5px}.category small{color:#78817e}.category em{position:absolute;right:13px;bottom:10px;font-style:normal;font-size:32px;opacity:.18}.custom{margin:18px 16px;padding:15px;border:1px dashed #9abeb7;border-radius:17px;background:#edf5f2}.custom b{font-size:15px}.custom p{font-size:13px;margin:5px 0 10px;color:#657370}.custom-row{display:flex;gap:8px}.custom input{flex:1;min-width:0;border:1px solid #c9dfd9;border-radius:11px;padding:10px;font:inherit}.custom button,.primary{border:0;background:var(--teal);color:white;border-radius:11px;padding:0 14px;font:inherit}.topbar{display:flex;align-items:center;gap:12px;margin:15px 16px}.back{border:0;width:36px;height:36px;border-radius:50%;background:#eaf1ee;color:var(--teal);font-size:21px}.topbar h2{font-size:20px;margin:0}.topbar p{font-size:12px;margin:3px 0 0;color:var(--muted)}.ingredient-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}.ingredient{min-height:82px;border:1px solid var(--line);border-radius:15px;background:var(--paper);padding:13px;text-align:left;color:var(--ink)}.ingredient b{display:block;font-size:16px}.ingredient span{display:block;margin-top:6px;font-size:12px;color:#73807d}.recipes{display:grid;gap:10px;padding:0 16px}.recipe{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:14px}.recipe b{font-size:16px}.recipe span{font-size:12px;color:var(--muted);display:block;margin-top:4px}.recipe button{border:0;border-radius:10px;background:#e5f1ed;color:var(--teal);font-weight:700;padding:9px 12px}.search-result{padding:0 16px;display:grid;gap:9px}.empty{text-align:center;color:#7c8583;padding:25px 16px}.bar{position:fixed;z-index:5;bottom:0;left:0;right:0;background:#fffdf9f4;backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:11px max(16px,calc((100vw - 560px)/2 + 16px));display:flex;justify-content:space-between;align-items:center}.bar b{font-size:15px}.bar small{display:block;margin-top:3px;color:var(--muted);font-size:12px}.bar button{border:0;border-radius:12px;background:var(--coral);color:white;padding:12px 16px;font-weight:700}.sheet{display:none;position:fixed;z-index:10;inset:0;background:#163e4055;align-items:flex-end}.sheet.show{display:flex}.panel{width:100%;max-width:560px;max-height:84vh;overflow:auto;margin:auto;background:#fffdfa;border-radius:25px 25px 0 0;padding:18px 18px calc(23px + env(safe-area-inset-bottom))}.handle{height:4px;width:42px;border-radius:4px;background:#ddd6cc;margin:0 auto 15px}.panel h2{margin:0 0 10px;font-size:20px}.line{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line);font-size:14px}.qty{display:flex;gap:8px;align-items:center}.qty button{border:0;border-radius:50%;width:27px;height:27px;background:#e7f1ed;color:var(--teal);font-size:17px}label{display:block;font-size:13px;margin:15px 0 7px;color:#566564}.date,textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;font:inherit;background:white}.meal{display:flex;gap:8px}.meal button{flex:1;border:1px solid var(--line);background:white;border-radius:10px;padding:11px;color:#556160}.meal .active{background:var(--ink);border-color:var(--ink);color:#fff}textarea{resize:none;height:65px}.submit{width:100%;border:0;border-radius:12px;padding:14px;background:var(--coral);color:#fff;font-size:16px;font-weight:700;margin-top:16px}.toast{display:none;position:fixed;z-index:12;left:50%;bottom:100px;transform:translateX(-50%);padding:10px 15px;background:#173c3e;color:white;border-radius:99px;white-space:nowrap;font-size:14px}.toast.show{display:block}
</style></head><body><main class="app"><div id="home"><section class="hero"><div class="eyebrow">FAMILY SEAFOOD MENU</div><h1>今日家宴</h1><p>先选食材，再决定怎么做。</p></section><div class="search">⌕<input id="search" placeholder="搜黄鱼、葱油、豆腐羹…"></div><div class="steps"><div class="step active">1 选食材</div><div class="step">2 选做法</div><div class="step">3 确认预订</div></div><div id="homeContent"></div><section class="custom"><b>想吃菜单外的菜？</b><p>直接写下菜名，也能加入本次预点菜单。</p><div class="custom-row"><input id="customName" placeholder="例如：番茄炒蛋" maxlength="30"><button id="addCustom">加入</button></div></section></div><div id="categoryView" hidden></div><div id="recipeView" hidden></div></main><footer class="bar"><div><b id="count">还没有选菜</b><small>点这里可修改数量</small></div><button id="openOrder">查看预订单</button></footer><div class="sheet" id="orderSheet"><section class="panel"><div class="handle"></div><h2>确认预点菜</h2><div id="orderList"></div><label>预定日期</label><input class="date" type="date" id="date"><label>用餐时段</label><div class="meal" id="meals"><button class="active">早饭</button><button>中饭</button><button>晚饭</button></div><label>备注</label><textarea id="note" placeholder="例如：少辣、不要香菜、预计 6 点开饭"></textarea><button id="submit" class="submit">生成预订单</button></section></div><div id="toast" class="toast"></div><script>
const catalog={"鱼":[["黄鱼",["葱油黄鱼","红烧黄鱼","雪菜黄鱼","椒盐黄鱼","香煎黄鱼","砂锅焗黄鱼"]],["鲳鱼",["葱油鲳鱼","红烧鲳鱼","雪菜鲳鱼","鲳鱼烧年糕"]],["虾潺",["葱油虾潺","红烧虾潺","椒盐虾潺","虾潺烧豆腐","虾潺焗豆腐"]],["玉秃",["葱油玉秃","红烧玉秃","香煎玉秃","玉秃蒸面结"]],["鸦片鱼头",["葱油鸦片鱼头","砂锅焗鸦片鱼头","鱼头豆腐汤"]],["鱿鱼",["葱油鱿鱼","葱姜炒鱿鱼","大蒜炒鱿鱼","蒜香干煎鱿鱼","荷兰豆炒鱿鱼","芹菜炒鱿鱼","酱爆鱿鱼","大虾炒鱿鱼"]],["鲈鱼",["葱油鲈鱼","红烧鲈鱼","雪菜鲈鱼","砂锅焗鲈鱼"]],["鳜鱼",["葱油鳜鱼","红烧鳜鱼","砂锅焗鳜鱼"]],["石斑鱼",["葱油石斑鱼","砂锅焗石斑鱼"]],["多宝鱼",["葱油多宝鱼"]],["昂刺鱼",["葱油昂刺鱼","红烧昂刺鱼","雪菜昂刺鱼"]],["黑鱼",["酸菜鱼","蒜香黑鱼片","葱油黑鱼片"]]],"虾":[["对虾",["蒜蓉粉丝对虾","清蒸对虾","椒盐对虾","油焖对虾","咖喱对虾","蒜香黄油对虾","砂锅焗对虾","盐水白灼对虾","避风塘对虾"]],["罗氏虾",["蒜蓉粉丝罗氏虾","清蒸罗氏虾","椒盐罗氏虾","油焖罗氏虾","咖喱罗氏虾","蒜香黄油罗氏虾","砂锅焗罗氏虾","盐水白灼罗氏虾","避风塘罗氏虾"]],["基围虾",["蒜蓉粉丝基围虾","清蒸基围虾","盐水白灼基围虾"]],["小白虾",["清蒸小白虾","盐水白灼小白虾"]],["皮皮虾",["清蒸皮皮虾","椒盐皮皮虾","砂锅焗皮皮虾","盐水白灼皮皮虾","葱烤皮皮虾"]],["虾仁",["芥末虾球","香葱虾球","葱爆虾仁","玉米粒炒虾仁","虾仁蒸蛋","虾仁滑蛋","西兰花炒虾仁","芦笋炒虾仁","西芹炒虾仁","咸蛋黄虾仁","椒盐虾仁","口蘑炒虾仁","时蔬虾饼"]]],"蟹":[["白蟹",["姜葱炒白蟹","清蒸白蟹","葱油白蟹","砂锅焗白蟹","白蟹炒年糕","白蟹豆腐羹","白蟹蒸蛋","酱烧白蟹","油焖白蟹"]],["毛蟹",["姜葱炒毛蟹","清蒸毛蟹","葱油毛蟹","砂锅焗毛蟹","毛蟹炒年糕","毛蟹豆腐羹","毛蟹蒸蛋","酱烧毛蟹","油焖毛蟹"]],["青蟹",["姜葱炒青蟹","清蒸青蟹","葱油青蟹","砂锅焗青蟹","青蟹炒年糕","青蟹豆腐羹","青蟹蒸蛋","酱烧青蟹","油焖青蟹"]]],"贝类":[["蛤蜊",["白灼蛤蜊","清蒸蛤蜊","葱油蛤蜊","葱姜炒蛤蜊","蒜香黄油蛤蜊","砂锅盐焗蛤蜊","蛤蜊蒸蛋","蛤蜊蛋花汤","蛤蜊丝瓜汤","蛤蜊冬瓜汤","酱爆蛤蜊"]],["花甲",["白灼花甲","清蒸花甲","葱油花甲","葱姜炒花甲","蒜香黄油花甲","砂锅盐焗花甲","花甲蒸蛋","花甲蛋花汤","花甲丝瓜汤","花甲冬瓜汤","酱爆花甲"]],["贻贝",["白灼贻贝","清蒸贻贝","葱油贻贝","葱姜炒贻贝","蒜香黄油贻贝","砂锅盐焗贻贝","贻贝蒸蛋","贻贝蛋花汤","贻贝丝瓜汤","贻贝冬瓜汤","酱爆贻贝"]],["花螺",["白灼花螺","清蒸花螺","葱油花螺","葱姜炒花螺","蒜香黄油花螺","砂锅盐焗花螺","酱爆花螺"]]],"海鲜拼盘":[["海鲜拼盘",["家烧海鲜拼盘","砂锅海鲜拼盘","清蒸海鲜拼盘","葱烧海鲜拼盘"]]]};
let order=[],activeCat='',meal='早饭';const $=s=>document.querySelector(s),all=()=>Object.entries(catalog).flatMap(([cat,foods])=>foods.flatMap(([food,dishes])=>dishes.map(name=>({cat,food,name}))));
function home(){let icons={鱼:'🐟',虾:'🦐',蟹:'🦀',贝类:'🐚',海鲜拼盘:'🍲'},tiles=Object.entries(catalog).map(([cat,foods])=>`<button class="category" data-cat="${cat}"><b>${cat}</b><small>${foods.length} 种食材 · 先选食材</small><em>${icons[cat]}</em></button>`).join('');$('#homeContent').innerHTML=`<div class="heading"><h2>从食材开始选</h2><span>选择后再挑做法</span></div><div class="categories">${tiles}</div>`;$('#homeContent').onclick=e=>{let b=e.target.closest('button');if(b?.dataset.cat)openCategory(b.dataset.cat)}}
function openCategory(cat){activeCat=cat;$('#home').hidden=true;$('#recipeView').hidden=true;let foods=catalog[cat];$('#categoryView').hidden=false;$('#categoryView').innerHTML=`<div class="topbar"><button class="back" data-back>‹</button><div><h2>选${cat}类食材</h2><p>先选今天想吃的食材</p></div></div><div class="ingredient-grid">${foods.map(([n,d])=>`<button class="ingredient" data-food="${n}"><b>${n}</b><span>${d.length} 种做法可选</span></button>`).join('')}</div>`;$('#categoryView').onclick=e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.back!==undefined)return showHome();if(b.dataset.food)openRecipes(b.dataset.food)}}
function openRecipes(food){let dishes=catalog[activeCat].find(x=>x[0]===food)[1];$('#categoryView').hidden=true;$('#recipeView').hidden=false;$('#recipeView').innerHTML=`<div class="topbar"><button class="back" data-back>‹</button><div><h2>${food}怎么做？</h2><p>选一种做法加入预订单</p></div></div><div class="recipes">${dishes.map(d=>`<article class="recipe"><div><b>${d}</b><span>${food} · 家宴预点</span></div><button data-add="${d}">加入</button></article>`).join('')}</div>`;$('#recipeView').onclick=e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.back!==undefined)return openCategory(activeCat);if(b.dataset.add)add(b.dataset.add)}}
function showHome(){$('#home').hidden=false;$('#categoryView').hidden=true;$('#recipeView').hidden=true}function search(q){if(!q){showHome();home();return}$('#home').hidden=false;$('#categoryView').hidden=true;$('#recipeView').hidden=true;let rows=all().filter(x=>(x.name+x.food+x.cat).includes(q));$('#homeContent').innerHTML=`<div class="heading"><h2>搜索结果</h2><span>${rows.length} 道菜</span></div><div class="search-result">${rows.length?rows.map(x=>`<article class="recipe"><div><b>${x.name}</b><span>${x.cat} · ${x.food}</span></div><button data-find="${x.name}">加入</button></article>`).join(''):'<div class="empty">没有找到，可使用下方“自定义菜”。</div>'}</div>`;$('#homeContent').onclick=e=>{let b=e.target.closest('button');if(b?.dataset.find)add(b.dataset.find)}}
function add(name){let item=order.find(x=>x.name===name);item?item.qty++:order.push({name,qty:1});update();toast('已加入 '+name)}function update(){let n=order.reduce((s,x)=>s+x.qty,0);$('#count').textContent=n?`已选 ${n} 道菜`:'还没有选菜';$('#orderList').innerHTML=order.length?order.map((x,i)=>`<div class="line"><span>${x.name}</span><div class="qty"><button data-i="${i}" data-d="-">−</button><b>${x.qty}</b><button data-i="${i}" data-d="+">＋</button></div></div>`).join(''):'<div class="empty">从食材开始挑一道吧</div>'}function toast(text){let el=$('#toast');el.textContent=text;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1500)}
$('#search').oninput=e=>search(e.target.value.trim());$('#addCustom').onclick=()=>{let n=$('#customName').value.trim();if(n){add(n);$('#customName').value=''}};$('#openOrder').onclick=()=>$('#orderSheet').classList.add('show');$('#orderSheet').onclick=e=>{if(e.target===$('#orderSheet'))$('#orderSheet').classList.remove('show')};$('#orderList').onclick=e=>{let b=e.target;if(b.dataset.i!==undefined){let x=order[+b.dataset.i];if(b.dataset.d==='+')x.qty++;else if(--x.qty===0)order.splice(+b.dataset.i,1);update()}};$('#meals').onclick=e=>{if(e.target.tagName==='BUTTON'){meal=e.target.textContent;[...$('#meals').children].forEach(x=>x.classList.toggle('active',x.textContent===meal))}};$('#date').valueAsDate=new Date();$('#submit').onclick=()=>{if(!order.length)return toast('请先选择菜品');toast(`已生成：${$('#date').value} ${meal}`);setTimeout(()=>$('#orderSheet').classList.remove('show'),800)};home();update();
</script><script src="handoff.js"></script></body></html>
